<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#DED7C8; font-family:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }

  .cover{ justify-content:space-between; }
  .cover .foot{ display:none; }
  .cover .notefoot{ margin-top:0; }
  .cover .notefoot .law{ display:block; margin-top:18px; font-size:28px; color:#8B8173; }
  .card{
    width:1080px; height:1440px; position:relative; overflow:hidden;
    background:#F4EEE1; color:#1B1814;
    display:flex; flex-direction:column;
    padding:96px 88px 84px;
  }
  /* 极淡噪点 */
  .card::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;
  }
  /* 细边框，文件感 */
  .frame{ position:absolute; inset:52px; border:1px solid rgba(27,24,20,.17); }

  .kicker{
    font-size:32px; letter-spacing:.22em; color:#6B6357; margin-bottom:44px;
    font-weight:500;
  }
  .kicker b{ color:#B5342A; font-weight:700; }

  .hero{
    font-size:224px; line-height:.94; font-weight:900; letter-spacing:-.02em;
    color:#1B1814;
  }
  .hero .dim{ color:#9A9080; }

  .sub{ margin-top:56px; font-size:46px; font-weight:700; color:#5F5749; letter-spacing:.02em; }
  .bigred{
    margin-top:20px; font-size:126px; line-height:1.06; font-weight:900; letter-spacing:-.01em;
    color:#B5342A;
  }
  .notefoot{
    margin-top:auto; padding-top:40px;
    border-top:1px solid rgba(27,24,20,.17);
    font-size:34px; color:#5F5749; font-weight:500; line-height:1.5;
  }
  .notefoot b{ color:#1B1814; font-weight:700; }
  .sub em{ font-style:normal; color:#B5342A; }

  .foot{
    position:absolute; left:88px; right:88px; bottom:96px;
    font-size:30px; color:#9A9080; letter-spacing:.04em;
    display:flex; justify-content:space-between; align-items:flex-end;
  }


  .cover .kicker{ position:relative; padding-top:38px; }
  .cover .kicker::before{
    content:""; position:absolute; top:0; left:0; width:138px; height:10px; background:#B5342A;
  }
  /* 印章 */
  .seal{
    position:absolute; width:300px; height:300px;
    right:96px; top:300px; transform:rotate(-11deg);
    display:flex; align-items:center; justify-content:center;
    border:9px solid #B5342A; border-radius:6px;
    color:#B5342A; font-size:118px; font-weight:900; letter-spacing:.04em;
    line-height:1;
    filter:url(#rough);
    opacity:.94;
  }
  .seal::after{
    content:""; position:absolute; inset:12px; border:2px solid rgba(181,52,42,.52); border-radius:3px;
  }

  /* 内页 */
  .h2{ font-size:74px; font-weight:900; line-height:1.18; letter-spacing:-.01em; }
  .h2 u{ text-decoration:none; color:#B5342A; }

  .rows{ margin-top:96px; display:flex; flex-direction:column; gap:0; }
  .row{
    display:flex; align-items:flex-start; gap:34px;
    padding:40px 0; border-top:1px solid rgba(27,24,20,.17);
  }
  .row:last-child{ border-bottom:1px solid rgba(27,24,20,.17); }
  .num{
    font-size:40px; font-weight:900; color:#B5342A; width:64px; flex:none;
    line-height:1.1; padding-top:6px;
  }
  .txt{ font-size:44px; line-height:1.5; font-weight:500; }
  .txt small{ display:block; font-size:30px; color:#6B6357; margin-top:10px; font-weight:400; line-height:1.4; }
  .cross{ color:#8B8173; text-decoration:line-through; text-decoration-thickness:5px; text-decoration-color:#B5342A; }

  .tri{ margin-top:96px; display:flex; flex-direction:column; }
  .tri .item{
    display:flex; align-items:baseline; gap:36px;
    padding:52px 0; border-top:1px solid rgba(27,24,20,.17);
  }
  .tri .item:last-child{ border-bottom:1px solid rgba(27,24,20,.17); }
  .code{ font-size:96px; font-weight:900; width:220px; flex:none; letter-spacing:-.03em; }
  .code.red{ color:#B5342A; }
  .code.grey{ color:#9B9182; }
  .desc{ font-size:40px; line-height:1.45; font-weight:500; }
  .desc small{ display:block; font-size:27px; color:#9A9080; margin-top:8px; font-weight:400; }

  s{ text-decoration:line-through; text-decoration-thickness:16px; text-decoration-color:#B5342A; }
  .rows{ margin-top:88px; }
  .row{ padding:42px 0; }
  .tri{ margin-top:88px; }
  .tri .item{ padding:48px 0; }
  .bigred{ color:#1B1814; }
  .bigred u{ text-decoration:none; background:linear-gradient(transparent 62%, rgba(181,52,42,.55) 62%); }
</style>
</head>
<body>
<div class="card cover" id="g1">
  <div class="frame"></div>
  <div class="seal">对账</div>
  <div>
    <div class="kicker">发工资那天</div>
    <div class="hero">20%</div>
  </div>
  <div>
    <div class="sub">公司扣钱，一个月最多</div>
    <div class="bigred">多扣就是克扣</div>
  </div>
  <div class="notefoot">扣完剩下的钱，不能低于当地最低工资标准
    <span class="law">工资支付暂行规定 第十六条</span>
  </div>
</div>

<div class="card" id="g2">
  <div class="frame"></div>
  <div class="kicker">扣钱合法 · 三个条件</div>
  <div class="h2">缺一条就是克扣</div>
  <div class="rows"><div class="row"><div class="num">1</div><div class="txt">你本人有过错<small>因你的原因给公司造成损失</small></div></div><div class="row"><div class="num">2</div><div class="txt">合同里有约定<small>内部通知不算约定</small></div></div><div class="row"><div class="num">3</div><div class="txt">每月不超 20%<small>且不把实发压到最低工资以下</small></div></div><div class="row"><div class="num">4</div><div class="txt">举证在公司<small>扣款有争议，公司拿证据</small></div></div></div>
  <div class="foot"><span>工资支付暂行规定 第十六条</span><span>02</span></div>
</div>

<div class="card" id="g3">
  <div class="frame"></div>
  <div class="kicker">工资条 · 看一眼</div>
  <div class="h2">扣款那一栏</div>
  <div class="rows"><div class="row"><div class="num">1</div><div class="txt">写「其他扣款」的<small>有权要求写清扣的是什么</small></div></div><div class="row"><div class="num">2</div><div class="txt">多扣的部分<small>可以要回来</small></div></div><div class="row"><div class="num">3</div><div class="txt">与个税社保无关<small>那是代扣，不是赔偿扣款</small></div></div><div class="row"><div class="num">4</div><div class="txt">基数是应得工资<small>算 20% 的分母别被算小</small></div></div></div>
  <div class="foot"><span>工资支付暂行规定 第十六条</span><span>03</span></div>
</div>
</body>
</html>
